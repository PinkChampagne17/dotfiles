$schema: https://taskfile.dev/schema.json
version: "3"

tasks:
  upgrade-tools:
    aliases: [ut]
    platforms: [darwin]
    cmds:
      - brew update
      - brew upgrade
      - proto upgrade --yes
      - cmd: proto outdated --update --yes
        dir: "{{.HOME}}"
      - cmd: proto install --yes
        dir: "{{.HOME}}"

  clean:
    cmds:
      - pnpm store prune
      - proto clean cache --yes
      - task: clean-darwin
      - task: clean-windows

  clean-darwin:
    platforms: [darwin]
    cmds:
      - brew cleanup
      - rm -rf "$HOME/.codex/worktrees"

  clean-windows:
    platforms: [windows]
    cmds:
      - scoop cleanup --all --cache
      - rm -rf "$USERPROFILE/.codex/worktrees"
