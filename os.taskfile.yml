$schema: https://taskfile.dev/schema.json
version: "3"

tasks:
  upgrade-tools:
    aliases: [ut]
    platforms: [darwin]
    cmds:
      - brew update
      - brew upgrade
      - proto upgrade --yes
      - cmd: proto outdated --update --yes
        dir: "{{.HOME_DIR}}"
      - cmd: proto install --yes
        dir: "{{.HOME_DIR}}"

  clean:
    cmds:
      - pnpm store prune
      - proto clean cache --yes
      - platforms: [darwin]
        cmd: brew cleanup
      - platforms: [windows]
        cmd: scoop cleanup --all --cache
      - rm -rf "{{.HOME_DIR}}/.codex/worktrees"
      - rm -rf "{{.HOME_DIR}}/.t3/worktrees"
