# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  upgrade-tools:
    aliases: [ut]
    platforms: [darwin]
    dir: "{{.HOME_DIR}}"
    requires:
      vars: [HOME_DIR]
    cmds:
      - brew update
      - brew upgrade
      - proto upgrade --yes
      - proto outdated --update --yes
      - proto install --yes

  clean:
    requires:
      vars: [HOME_DIR]
    cmds:
      - pnpm store prune
      - proto clean cache --yes
      - platforms: [darwin]
        cmd: brew cleanup
      - platforms: [windows]
        cmd: scoop cleanup --all --cache
      - rm -rf "{{.HOME_DIR}}/.codex/worktrees"
      - rm -rf "{{.HOME_DIR}}/.t3/worktrees"
