version: "3"

includes:
  configs:
    taskfile: ./configs/taskfile.yml
    dir: ./configs
  nixos:
    taskfile: ./nixos/taskfile.yml
    dir: ./nixos
  os:
    taskfile: ./os.taskfile.yml

env:
  CHEZMOI_CONFIG_PATH: .config/chezmoi/chezmoi.toml

tasks:
  default:
    cmds:
      - task: apply
      - task: apply-npm-config
      - task: skills

  apply:
    cmds:
      - chezmoi apply -v

  apply-npm-config:
    cmds:
      - task: apply-npm-config-windows

  apply-npm-config-windows:
    platforms: [windows]
    cmds:
      - pnpm config set proxy http://localhost:7890
      - pnpm config set https-proxy http://localhost:7890
      - pnpm config set scriptShell "C:\\Program Files\\git\\bin\\bash.exe"

  skills:
    cmds:
      - >-
          pnpm dlx skills add mattpocock/skills --yes --global --agent universal claude-code
          -s batch-grill-me
          -s code-review
          -s domain-modeling
          -s grill-me
          -s grill-with-docs
          -s grilling
          -s handoff
      - pnpm dlx skills add p-toy-factory/anti-pua --yes --global --agent universal claude-code -s '*'
      - pnpm dlx skills add ./skills --yes --global --agent universal claude-code -s '*'

  fmt:
    cmds:
      - dprint fmt

  init:
    prompt: This is a dangerous command... Do you want to continue?

    cmds:
      - chezmoi init

      # TODO: For Windows
      - platforms: [darwin, linux]
        cmd: nano $HOME/$CHEZMOI_CONFIG_PATH

      - task: configs:bbi
      - task: default

  open-config-file:
    aliases: [ocf]
    cmds:
      - $EDITOR $HOME/$CHEZMOI_CONFIG_PATH

  update:
    cmds:
      - dprint config update
