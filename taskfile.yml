# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  configs:
    taskfile: ./configs/taskfile.yml
    dir: ./configs
  nixos:
    taskfile: ./nixos/taskfile.yml
    dir: ./nixos
  os: ./os.taskfile.yml

vars:
  HOME_DIR: '{{if eq OS "windows"}}{{.USERPROFILE}}{{else}}{{.HOME}}{{end}}'

env:
  CHEZMOI_CONFIG_PATH: .config/chezmoi/chezmoi.toml

tasks:
  default:
    cmds:
      - task: apply
      - task: apply-npm-config
      - task: skills

  apply:
    cmds:
      - chezmoi apply -v

  apply-npm-config:
    cmds:
      - task: apply-npm-config-windows

  apply-npm-config-windows:
    platforms: [windows]
    cmds:
      - pnpm config set proxy http://localhost:7890
      - pnpm config set https-proxy http://localhost:7890
      - pnpm config set scriptShell "C:\\Program Files\\git\\bin\\bash.exe"

  skills:
    cmds:
      - pnpm dlx skills remove --global --all
      - >-
        pnpm dlx skills add mattpocock/skills --yes --global --agent universal claude-code
        -s batch-grill-me
        -s code-review
        -s domain-modeling
        -s grill-me
        -s grill-with-docs
        -s grilling
        -s handoff
        -s improve-codebase-architecture
        -s writing-for-agents
        -s wait-what
        -s wayfinder
      - pnpm dlx skills add p-toy-factory/anti-pua --yes --global --agent universal claude-code -s '*'
      # cursor/plugins skills. One call per source, so the mapping lives here.
      # Convention: a skill I did not ask for stays in this block with the skill that needs it.
      # Explicit: interrogate, reflect, sharpen, statechart.
      # Indirect, in the same order as the -s lines below:
      #   arena, in-your-own-words -> interrogate
      #   principle-laziness-protocol, principle-prove-it-works,
      #   principle-redesign-from-first-principles,
      #   principle-separate-before-serializing-shared-state,
      #   poteto-mode -> arena, and reflect, for its Subagents section only.
      #     Its other routes cite about 34 pstack skills that are not installed.
      #   principle-encode-lessons-in-structure -> reflect
      #   create-formal-verification-skill, maintain-formal-verification-skill
      #     -> companion of statechart, they read TLA+ results with /statechart
      - >-
        pnpm dlx skills add https://github.com/cursor/plugins/tree/main --yes --global --agent universal claude-code
        -s interrogate
        -s reflect
        -s sharpen
        -s statechart
        -s arena
        -s in-your-own-words
        -s principle-laziness-protocol
        -s principle-prove-it-works
        -s principle-redesign-from-first-principles
        -s principle-separate-before-serializing-shared-state
        -s poteto-mode
        -s principle-encode-lessons-in-structure
        -s create-formal-verification-skill
        -s maintain-formal-verification-skill
      - pnpm dlx skills add ./skills --yes --global --agent universal claude-code -s '*'

  fmt:
    cmds:
      - dprint fmt

  check:
    cmds:
      - pnpm dlx @lintel/lintel@0.0.19 validate --verbose '**/*.yaml' '**/*.yml' '**/*.json' '**/*.jsonc'

  init:
    prompt: This is a dangerous command... Do you want to continue?

    cmds:
      - chezmoi init

      # TODO: For Windows
      - platforms: [darwin, linux]
        cmd: nano {{.HOME_DIR}}/$CHEZMOI_CONFIG_PATH

      - task: configs:bbi
      - task: default

  open-config-file:
    aliases: [ocf]
    cmds:
      - $EDITOR {{.HOME_DIR}}/$CHEZMOI_CONFIG_PATH

  update:
    cmds:
      - dprint config update
